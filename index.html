<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XKOEN PRO COMMANDER</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #log { font-size: 10px; padding: 10px; height: 100px; background: #050505; border-bottom: 1px solid #00ff00; overflow-y: auto; }
        #visor-container { flex-grow: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .controles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; background: #111; border-top: 1px solid #333; }
        .btn { background: #222; border: 1px solid #00ff00; color: #00ff00; padding: 18px 0; border-radius: 8px; font-size: 11px; font-weight: bold; text-align: center; cursor: pointer; }
        .btn:active { background: #00ff00; color: #000; }
        /* El selector que va a forzar la entrada */
        #selector-lente { position: absolute; top: 15px; width: 90%; background: #00ff00; color: #000; padding: 15px; border-radius: 5px; font-weight: bold; z-index: 100; border: none; font-size: 14px; }
    </style>
</head>
<body>

    <div id="log">>> SISTEMA XKOEN: ONLINE<br>>> BUSCANDO HARDWARE EXTERNO...</div>

    <div id="visor-container">
        <select id="selector-lente" onchange="forzarLente(this.value)">
            <option value="">-- SELECCIONAR LENTE DE GAFAS --</option>
        </select>
        <video id="video-visor" autoplay playsinline muted></video>
    </div>

    <div class="controles">
        <div class="btn" onclick="alert('Captura OK')">📸 FOTO</div>
        <div class="btn" style="color:#ff4444; border-color:#ff4444;">🔴 REC</div>
        <div class="btn">🔆 BRILLO</div>
        <div class="btn" onclick="location.reload()">🔄 RESET</div>
    </div>

    <script>
        const v = document.getElementById('video-visor');
        const l = document.getElementById('log');
        const s = document.getElementById('selector-lente');

        function print(msg) {
            l.innerHTML += `<br>>> ${msg}`;
            l.scrollTop = l.scrollHeight;
        }

        async function cargarDispositivos() {
            try {
                // Forzar la solicitud de permisos al inicio
                await navigator.mediaDevices.getUserMedia({ video: true });
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                const camaras = dispositivos.filter(d => d.kind === 'videoinput');

                print(`DETECTADAS: ${camaras.length} CÁMARAS`);

                camaras.forEach((cam, i) => {
                    const opt = document.createElement('option');
                    opt.value = cam.deviceId;
                    // Buscamos nombres como "USB" o el ID 3
                    opt.text = cam.label || `Lente Externo ${i + 1}`;
                    s.appendChild(opt);
                });

                print("LISTO. SELECCIONE EL LENTE EN EL MENÚ VERDE.");
            } catch (err) {
                print("ERROR: DEBE DAR PERMISOS DE CÁMARA");
            }
        }

        async function forzarLente(id) {
            if (!id) return;
            print("VINCULANDO LENTE XKOEN...");
            
            // Detener transmisiones previas
            if (window.st) {
                window.st.getTracks().forEach(t => t.stop());
            }

            try {
                // Intentamos abrir el lente con la máxima resolución posible
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: { exact: id }, width: 1920, height: 1080 }
                });
                window.st = stream;
                v.srcObject = stream;
                print("TRANSMISIÓN ESTABLECIDA");
                s.style.opacity = "0.2"; // Opacar para no tapar la vista
            } catch (e) {
                print("FALLO DE ENLACE: PRUEBE OTRA OPCIÓN");
            }
        }

        window.onload = cargarDispositivos;
    </script>
</body>
</html>
