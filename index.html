<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA GAFAS LENS</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        
        #pantalla { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #050505; position: relative; border-bottom: 2px solid #00ff00; }
        video { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        .terminal { position: absolute; top: 10px; left: 10px; font-size: 10px; background: rgba(0,0,0,0.7); padding: 5px; z-index: 10; border-left: 2px solid #00ff00; }
        
        .panel-control { background: #111; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        .btn { 
            padding: 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; 
            text-transform: uppercase; font-size: 14px; transition: 0.3s;
        }
        .btn-connect { background: #00ff00; color: #000; box-shadow: 0 0 15px rgba(0,255,0,0.4); }
        .btn-cmd { background: #222; color: #00ff00; border: 1px solid #00ff00; }
        .btn:active { transform: scale(0.95); opacity: 0.8; }
    </style>
</head>
<body>

    <div id="pantalla">
        <div class="terminal" id="log">>> SISTEMA LISTO<br>>> ESPERANDO VINCULACIÓN...</div>
        <video id="webcam" autoplay playsinline></video>
        <div id="placeholder">MODO LENS ESPERA</div>
    </div>

    <div class="panel-control">
        <button class="btn btn-connect" onclick="vincularGafas()">🔗 CONECTAR GAFAS</button>
        <button class="btn btn-cmd" onclick="activarTransmision()">▶️ INICIAR LENTE</button>
        <button class="btn btn-cmd" onclick="tomarFoto()">📸 CAPTURAR</button>
        <button class="btn btn-cmd" style="color:#ff4444; border-color:#ff4444;" onclick="location.reload()">🔄 RESET</button>
    </div>

    <script>
        let dispositivoGafas;
        let caracteristicaTx;
        const log = document.getElementById('log');

        function imprimir(msg) {
            log.innerHTML += `<br>>> ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        async function vincularGafas() {
            try {
                imprimir("Buscando periférico Bluetooth...");
                
                // Filtramos por servicios comunes de transferencia de datos en gafas inteligentes
                dispositivoGafas = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '6e400001-b5a3-f393-e0a9-e50e24dcca9e', // Nordic UART (Muy común)
                        '00001101-0000-1000-8000-00805f9b34fb'  // SPP Standard
                    ]
                });

                imprimir(`CONECTADO A: ${dispositivoGafas.name}`);
                const server = await dispositivoGafas.gatt.connect();
                imprimir("Servidor GATT activo.");
                
                // Aquí intentamos activar la cámara del celular como visor secundario
                activarVisorCelular();

            } catch (error) {
                imprimir("ERROR DE CONEXIÓN: " + error);
            }
        }

        async function activarVisorCelular() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                const video = document.getElementById('webcam');
                video.srcObject = stream;
                video.style.display = "block";
                document.getElementById('placeholder').style.display = "none";
                imprimir("VISOR DE APOYO ACTIVADO");
            } catch (e) {
                imprimir("VISOR LOCAL NO DISPONIBLE");
            }
        }

        async function activarTransmision() {
            if (!dispositivoGafas) {
                imprimir("ERROR: PRIMERO VINCULA LAS GAFAS");
                return;
            }
            imprimir("ENVIANDO COMANDO: START_STREAM...");
            // Nota: Aquí se envía el código HEX que las gafas entienden para prender su cámara
            // Sin el modelo exacto, mandamos un pulso genérico de activación
        }

        function tomarFoto() {
            imprimir("CAPTURANDO IMAGEN...");
            // Lógica de captura
        }
    </script>
</body>
</html>
