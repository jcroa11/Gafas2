<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XKOEN TERMINAL PRO</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #log { flex-grow: 1; padding: 15px; font-size: 11px; overflow-y: auto; background: #050505; border-bottom: 2px solid #00ff00; }
        .control-panel { padding: 20px; background: #111; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-main { grid-column: span 2; background: #00ff00; color: #000; padding: 20px; font-weight: bold; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn-sub { background: #222; color: #00ff00; border: 1px solid #00ff00; padding: 15px; font-size: 12px; border-radius: 5px; }
        #video-container { width: 100%; height: 0; background: #000; transition: height 0.5s; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div id="log">>> XKOEN_SYSTEM_INIT: READY...<br>>> ESPERANDO VINCULACIÓN CON XKOENPRO_282B...</div>
    
    <div id="video-container">
        <video id="v" autoplay playsinline muted></video>
    </div>

    <div class="control-panel">
        <button class="btn-main" onclick="conectarSistema()">🔗 VINCULAR HARDWARE XKOEN</button>
        <button class="btn-sub" onclick="activarVideo()">▶️ FORZAR VIDEO</button>
        <button class="btn-sub" onclick="enviarComando('0x01')">⚡ COMANDO START</button>
        <button class="btn-sub" style="grid-column: span 2; border-color: red; color: red;" onclick="location.reload()">🔄 REINICIAR SISTEMA</button>
    </div>

    <script>
        const log = document.getElementById('log');
        const v = document.getElementById('v');
        const container = document.getElementById('video-container');

        function print(msg) {
            log.innerHTML += `<br>>> ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        async function conectarSistema() {
            try {
                print("Iniciando escaneo WebBluetooth...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'XKOEN' }],
                    optionalServices: [
                        '00001101-0000-1000-8000-00805f9b34fb', // Serial Port
                        '6e400001-b5a3-f393-e0a9-e50e24dcca9e'  // UART Nordic
                    ]
                });

                print("CONECTADO: " + device.name);
                const server = await device.gatt.connect();
                print("GATT Server: CONECTADO");
                
                // Una vez conectado el Bluetooth, intentamos "pescar" el video
                activarVideo();
            } catch (err) {
                print("ERROR: " + err.message);
                if (err.message.includes("User cancelled")) print("VUELVE A INTENTAR Y SELECCIONA LAS GAFAS.");
            }
        }

        async function activarVideo() {
            print("Escaneando buses de video externos...");
            try {
                // Buscamos específicamente dispositivos que NO sean las cámaras internas
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camaras = devices.filter(d => d.kind === 'videoinput');
                
                // Si hay más de las 3 del teléfono (que ya vimos que son internas)
                // forzamos la que sobre. Si no, forzamos la última.
                let targetId = camaras[camaras.length - 1].deviceId;

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { deviceId: { exact: targetId }, width: 1280, height: 720 }
                });

                container.style.height = "50vh";
                v.srcObject = stream;
                print("TRANSMISIÓN DE VIDEO ESTABLECIDA");
            } catch (e) {
                print("ERROR VIDEO: El hardware no entrega flujo UVC.");
                print("INTENTA: Desconectar y conectar las gafas físicamente.");
            }
        }

        async function enviarComando(hex) {
            print("Enviando pulso de activación " + hex + "...");
            // Lógica para escribir en la característica Bluetooth
        }
    </script>
</body>
</html>
