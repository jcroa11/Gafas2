<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XKOEN PRO BYPASS</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #log { height: 150px; padding: 15px; font-size: 11px; background: #050505; border-bottom: 2px solid #00ff00; overflow-y: auto; text-align: left; }
        #visor-container { flex-grow: 1; background: #111; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .controles { padding: 25px; background: #111; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-accion { grid-column: span 2; padding: 30px; background: #ff0000; color: #fff; border: none; border-radius: 15px; font-weight: bold; font-size: 20px; cursor: pointer; }
        .btn-bt { background: #222; color: #00ff00; border: 1px solid #00ff00; padding: 15px; border-radius: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div id="log">>> SISTEMA: ESPERANDO HARDWARE...<br>>> MODO: SJ_SDK DATA-LINK</div>

<div id="visor-container">
    <canvas id="canvas-visor"></canvas>
</div>

<div class="controles">
    <button id="btn-master" class="btn-accion" onclick="controlGafas()">🔴 ENCENDER Y GRABAR</button>
    <button class="btn-bt" onclick="conectarBT()">🔗 VINCULAR BT</button>
    <button onclick="location.reload()" style="background:none; border:none; color:#444;">RESET</button>
</div>

<script>
    const terminal = document.getElementById('log');
    const masterBtn = document.getElementById('btn-master');
    let gatt, characteristic;
    let encendido = false;

    function imprimir(msg) { terminal.innerHTML += `<br>>> ${msg}`; terminal.scrollTop = terminal.scrollHeight; }

    async function conectarBT() {
        try {
            imprimir("Buscando XKOENPRO_282B...");
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'XKOEN' }],
                optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
            });
            
            imprimir("Conectando al socket...");
            gatt = await device.gatt.connect();
            const service = await gatt.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
            characteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
            
            imprimir("ENLACE EXITOSO: " + device.name);
            masterBtn.innerText = "▶️ INICIAR LENTE";
            masterBtn.style.background = "#00ff00";
            masterBtn.style.color = "#000";
        } catch (e) {
            imprimir("ERROR: " + e.message);
        }
    }

    async function controlGafas() {
        if (!characteristic) {
            imprimir("ERROR: PRIMERO VINCULA EL BLUETOOTH");
            return;
        }

        try {
            if (!encendido) {
                // Comando SJ_SDK para "PLAY" (Sacado de tu log)
                const playCmd = new Uint8Array([0xAB, 0x01, 0x03, 0x01, 0x00, 0x01]);
                await characteristic.writeValue(playCmd);
                imprimir("COMANDO 'PLAY' ENVIADO. GRABANDO...");
                masterBtn.innerText = "⏹️ DETENER Y GUARDAR";
                masterBtn.style.background = "#fff";
                masterBtn.style.color = "#ff0000";
                encendido = true;
            } else {
                // Comando STOP
                const stopCmd = new Uint8Array([0xAB, 0x01, 0x03, 0x01, 0x00, 0x00]);
                await characteristic.writeValue(stopCmd);
                imprimir("COMANDO 'STOP' ENVIADO.");
                masterBtn.innerText = "🔴 ENCENDER Y GRABAR";
                masterBtn.style.background = "#ff0000";
                masterBtn.style.color = "#fff";
                encendido = false;
            }
        } catch (err) {
            imprimir("FALLO DE HARDWARE: " + err.message);
        }
    }
</script>
</body>
</html>
