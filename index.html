<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VISOR PRO LENS</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; overflow: hidden; }
        
        /* Contenedor del video tipo visor */
        #visor { 
            position: relative; width: 100vw; height: 70vh; background: #050505; 
            border-bottom: 2px solid #00ff00; display: flex; align-items: center; justify-content: center;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* El botón principal estilo Lens */
        .btn-lens { 
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 80px; background: rgba(0, 255, 0, 0.2); 
            border: 4px solid #00ff00; border-radius: 50%; cursor: pointer;
            box-shadow: 0 0 15px #00ff00; z-index: 10;
        }
        .btn-lens:active { background: #00ff00; }

        /* Panel de controles inferiores */
        .controles { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; 
            padding: 20px; background: #111; height: 30vh;
        }
        .boton { 
            background: #222; border: 1px solid #444; color: #fff; padding: 15px 5px; 
            border-radius: 10px; font-size: 12px; font-weight: bold; text-transform: uppercase;
        }
        #info { position: absolute; top: 10px; left: 10px; font-size: 10px; color: #00ff00; z-index: 5; }
    </style>
</head>
<body>

    <div id="info">SISTEMA: LISTO | MODO: LENS</div>

    <div id="visor">
        <video id="camara" autoplay playsinline muted></video>
        <div class="btn-lens" onclick="iniciarCamara()" title="Activar Cámara"></div>
    </div>

    <div class="controles">
        <button class="boton" onclick="alert('Foto guardada')">📸 FOTO</button>
        <button class="boton" style="color: #ff4444;">🔴 REC</button>
        <button class="boton">🔆 BRILLO</button>
        <button class="boton">🔍 ZOOM</button>
    </div>

    <script>
        async function iniciarCamara() {
            const video = document.getElementById('camara');
            const info = document.getElementById('info');
            
            try {
                info.innerText = "SISTEMA: ACCEDIENDO A LENTE...";
                
                // Intenta buscar la cámara trasera (entorno) directamente
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: { exact: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                video.srcObject = stream;
                info.innerText = "SISTEMA: ONLINE";
                document.querySelector('.btn-lens').style.display = 'none'; // Desaparece al activar
                
            } catch (err) {
                // Si falla la trasera (o estás en PC), usa cualquier cámara disponible
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = fallback;
                info.innerText = "SISTEMA: MODO COMPATIBILIDAD";
            }
        }
    </script>
</body>
</html>
