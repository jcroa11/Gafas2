<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XKOEN PRO BYPASS</title>
    <style>
        body { background: #000; color: #00ff00; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #terminal { height: 130px; padding: 12px; font-size: 11px; background: #050505; border-bottom: 2px solid #00ff00; overflow-y: auto; text-align: left; }
        #visor-container { flex-grow: 1; background: #111; display: flex; align-items: center; justify-content: center; position: relative; }
        canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .controles { padding: 20px; background: #111; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-play { grid-column: span 2; padding: 25px; background: #ff0000; color: #fff; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-play.on { background: #fff; color: #ff0000; border: 2px solid #ff0000; }
    </style>
</head>
<body>

    <div id="terminal">>> SISTEMA XKOEN: ONLINE<br>>> MODO: DATA-LINK (SJ_SDK)</div>

    <div id="visor-container">
        <canvas id="canvas-visor"></canvas>
    </div>

    <div class="controles">
        <button id="btn-master" class="btn-play" onclick="accionPrincipal()">
            <span id="ico">🔴</span> <span id="txt">CONECTAR Y GRABAR</span>
        </button>
        <button onclick="vincularBT()" style="background:#222; color:#00ff00; border:1px solid #00ff00; padding:12px; border-radius:10px;">🔗 VINCULAR BT</button>
        <button onclick="location.reload()" style="background:none; color:#444; border:none; font-size:10px;">🔄 RESET</button>
    </div>

    <script>
        const log = document.getElementById('terminal');
        const btn = document.getElementById('btn-master');
        let gatt, charControl;
        let activo = false;

        function print(msg) { log.innerHTML += `<br>>> ${msg}`; log.scrollTop = log.scrollHeight; }

        async function vincularBT() {
            try {
                print("Buscando XKOENPRO_282B...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'XKOEN' }],
                    optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
                });
                gatt = await device.gatt.connect();
                const service = await gatt.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
                charControl = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');
                print("ENLACE ESTABLECIDO CON GAFAS.");
                document.getElementById('txt').innerText = "INICIAR LENTE";
            } catch (e) { print("ERROR: ACTIVA EL BLUETOOTH Y DA PERMISOS."); }
        }

        async function accionPrincipal() {
            if (!charControl) {
                await vincularBT();
                return;
            }

            try {
                if (!activo) {
                    // COMANDO PLAY (Lensmoo Style)
                    const playCmd = new Uint8Array([0xAB, 0x01, 0x03, 0x01, 0x00, 0x01]);
                    await charControl.writeValue(playCmd);
                    print("COMANDO 'PLAY' ENVIADO. LENTE ACTIVADO.");
                    
                    btn.classList.add('on');
                    document.getElementById('txt').innerText = "DETENER Y GUARDAR";
                    document.getElementById('ico').innerText = "⏹️";
                    activo = true;
                } else {
                    // COMANDO STOP
                    const stopCmd = new Uint8Array([0xAB, 0x01, 0x03, 0x01, 0x00, 0x00]);
                    await charControl.writeValue(stopCmd);
                    print("COMANDO 'STOP' ENVIADO.");
                    
                    btn.classList.remove('on');
                    document.getElementById('txt').innerText = "CONECTAR Y GRABAR";
                    document.getElementById('ico').innerText = "🔴";
                    activo = false;
                }
            } catch (err) { print("FALLO DE HARDWARE: " + err.message); }
        }
    </script>
</body>
</html>
