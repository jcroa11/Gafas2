<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SISTEMA GAFAS LENS</title>
    <style>
        body { background: #000; color: #00ff00; font-family: 'Courier New', monospace; margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; }
        #visor { flex-grow: 1; background: #050505; position: relative; border-bottom: 2px solid #00ff00; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .terminal { position: absolute; top: 10px; left: 10px; font-size: 10px; background: rgba(0,0,0,0.8); padding: 5px; z-index: 10; border-left: 2px solid #00ff00; }
        .controles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; background: #111; height: 150px; }
        .btn { background: #222; border: 1px solid #444; color: #fff; border-radius: 10px; font-size: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
        .btn:active { background: #00ff00; color: #000; }
        #btn-conectar { position: absolute; z-index: 20; padding: 20px; background: #00ff00; color: #000; border: none; font-weight: bold; border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px #00ff00; }
    </style>
</head>
<body>

    <div id="visor">
        <div class="terminal" id="log">>> SISTEMA: LISTO<br>>> ESPERANDO ENLACE...</div>
        <button id="btn-conectar" onclick="activarLente()">ACTIVAR LENTE GAFAS</button>
        <video id="v" autoplay playsinline muted></video>
    </div>

    <div class="controles">
        <div class="btn" onclick="alert('Capturando...')">📸<br>FOTO</div>
        <div class="btn" style="color:red">🔴<br>REC</div>
        <div class="btn">🔆<br>BRILLO</div>
        <div class="btn" onclick="location.reload()">🔄<br>RESET</div>
    </div>

    <script>
        const video = document.getElementById('v');
        const log = document.getElementById('log');
        const btn = document.getElementById('btn-conectar');

        function imprimir(msg) {
            log.innerHTML += `<br>>> ${msg}`;
            log.scrollTop = log.scrollHeight;
        }

        async function activarLente() {
            try {
                imprimir("ESCANEANDO HARDWARE...");
                
                // Pedir permisos primero
                await navigator.mediaDevices.getUserMedia({ video: true });
                
                // Listar todas las cámaras
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                const camaras = dispositivos.filter(d => d.kind === 'videoinput');
                
                imprimir(`DETECTADAS: ${camaras.length} CÁMARAS`);

                // LÓGICA DE SALTO: Si hay más de una, la última suele ser la externa/gafas
                let seleccionado = camaras[camaras.length - 1].deviceId;

                const config = {
                    video: {
                        deviceId: { exact: seleccionado },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(config);
                video.srcObject = stream;
                
                imprimir("ESTADO: TRANSMITIENDO");
                btn.style.display = 'none'; // Ocultar botón tras conectar

            } catch (err) {
                imprimir("ERROR: REINTENTANDO CONEXIÓN GENÉRICA...");
                // Si falla lo anterior, intenta abrir cualquier cámara trasera
                const fallback = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = fallback;
                btn.style.display = 'none';
            }
        }
    </script>
</body>
</html>
