<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Gafas Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        #visor { width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #111; margin: 10px auto; border: 2px solid #00ff00; border-radius: 12px; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-vinculo { width: 100%; max-width: 600px; padding: 25px; background: #00ff00; color: #000; border: none; border-radius: 15px; font-size: 20px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 600px; margin: 10px auto; }
        button.accion { padding: 20px; border: none; border-radius: 12px; font-weight: bold; color: white; text-transform: uppercase; }
        #estado { color: #0f0; background: #222; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="estado">SISTEMA LISTO</div>

    <button class="btn-vinculo" onclick="conectarBluetooth()">🔗 CONECTAR GAFAS (BLUETOOTH)</button>

    <div id="visor">
        <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="controles">
        <button class="accion" style="background:#ffcc00; color:000;">📸 FOTO</button>
        <button class="accion" style="background:#ff4444;">🎥 GRABAR</button>
        <button class="accion" style="background:#007bff;">VOL +</button>
        <button class="accion" style="background:#007bff;">VOL -</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const estado = document.getElementById('estado');

        async function conectarBluetooth() {
            try {
                estado.innerText = "BUSCANDO DISPOSITIVO...";
                // Esto abre la ventana para elegir las gafas
                await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
                
                estado.innerText = "GAFAS VINCULADAS. CARGANDO VIDEO...";

                // Intentamos capturar el video
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                video.srcObject = stream;
                
            } catch (err) {
                estado.innerText = "ERROR O CANCELADO. REINTENTA.";
                // Si falla el Bluetooth, abrimos la cámara del celu para que no quede en negro
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = fallback;
            }
        }
    </script>
</body>
</html>
