<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Gafas Pro</title>
    <style>
        /* Diseño oscuro y botones grandes para celular */
        body { 
            background-color: #121212; 
            color: white; 
            font-family: sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
        }
        #contenedor-video { 
            width: 100%; 
            max-width: 500px; 
            aspect-ratio: 16/9; 
            background: #000; 
            margin: 15px auto; 
            border: 3px solid #333; 
            border-radius: 15px; 
            overflow: hidden; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        .controles { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            max-width: 500px; 
            margin: 20px auto; 
        }
        button { 
            padding: 25px; 
            font-weight: bold; 
            border: none; 
            border-radius: 12px; 
            font-size: 18px; 
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-foto { background-color: #ffcc00; color: black; }
        .btn-grabar { background-color: #ff4444; color: white; }
        .btn-vol { background-color: #007bff; color: white; }
        
        #estado { 
            color: #00ff00; 
            font-weight: bold; 
            margin: 10px 0;
            padding: 10px;
            background: #222;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h2>SISTEMA GAFAS INTELIGENTES</h2>
    
    <div id="contenedor-video">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="estado">INICIALIZANDO...</div>

    <div class="controles">
        <button class="btn-foto" onclick="alert('Capturando Foto...')">📸 FOTO</button>
        <button class="btn-grabar" onclick="alert('Grabando Video...')">🎥 GRABAR</button>
        <button class="btn-vol" onclick="alert('Volumen +')">VOL +</button>
        <button class="btn-vol" onclick="alert('Volumen -')">VOL -</button>
    </div>

    <script>
        async function conectarCamara() {
            const estado = document.getElementById('estado');
            try {
                // Listamos todas las cámaras conectadas
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                const camaras = dispositivos.filter(d => d.kind === 'videoinput');

                // Si hay más de 2 cámaras, la última suele ser la de las gafas (USB)
                // Si solo hay una, usamos esa.
                let idSeleccionado = null;
                if (camaras.length > 2) {
                    idSeleccionado = camaras[camaras.length - 1].deviceId;
                    estado.innerText = "ESTADO: GAFAS DETECTADAS";
                } else {
                    estado.innerText = "ESTADO: CÁMARA CELULAR (CONECTA LAS GAFAS)";
                }

                const configuracion = {
                    video: idSeleccionado ? { deviceId: { exact: idSeleccionado } } : { facingMode: "environment" }
                };

                const stream = await navigator.mediaDevices.getUserMedia(configuracion);
                document.getElementById('video').srcObject = stream;

            } catch (err) {
                console.error(err);
                estado.innerText = "ERROR: DALE PERMISO A LA CÁMARA O REVISA EL CABLE";
                estado.style.color = "red";
            }
        }

        // Ejecutar al cargar la página
        window.onload = conectarCamara;
    </script>
</body>
</html>
