
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Gafas</title>
    <style>
        body { background-color: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 15px; }
        #contenedor-video { 
            width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #111; 
            margin: 10px auto; border: 2px solid #444; border-radius: 12px; overflow: hidden; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Estilo para el selector de cámara */
        .selector-camara {
            width: 100%; max-width: 600px; padding: 15px; margin: 10px auto;
            background: #222; border: 1px solid #444; border-radius: 10px;
            color: white; font-size: 16px;
        }

        .panel-control { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 600px; margin: 15px auto; }
        button { padding: 20px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-foto { background: #ffcc00; color: #000; }
        .btn-grabar { background: #ff4444; color: #fff; }
        .btn-vol { background: #007bff; color: #fff; }
        #estado { color: #0f0; margin-bottom: 5px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="estado">LISTO PARA CONECTAR</div>

    <div id="contenedor-video">
        <video id="webcam" autoplay playsinline></video>
    </div>

    <select id="listaCamaras" class="selector-camara">
        <option value="">Buscando cámaras...</option>
    </select>

    <div class="panel-control">
        <button class="btn-foto">📸 FOTO</button>
        <button class="btn-grabar">🎥 GRABAR</button>
        <button class="btn-vol">VOL +</button>
        <button class="btn-vol">VOL -</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const selectCamaras = document.getElementById('listaCamaras');
        const estado = document.getElementById('estado');
        let currentStream;

        // 1. Obtener la lista de cámaras y llenar el selector
        async function cargarCamaras() {
            try {
                // Pedir permiso primero para poder leer los nombres de las cámaras
                await navigator.mediaDevices.getUserMedia({ video: true });
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                const camaras = dispositivos.filter(d => d.kind === 'videoinput');

                selectCamaras.innerHTML = ''; // Limpiar selector

                camaras.forEach((camara, index) => {
                    const opcion = document.createElement('option');
                    opcion.value = camara.deviceId;
                    opcion.text = camara.label || `Cámara ${index + 1}`;
                    selectCamaras.appendChild(opcion);
                });

                // Si hay cámaras, iniciar con la primera de la lista
                if (camaras.length > 0) {
                    iniciarStream(camaras[0].deviceId);
                }
            } catch (err) {
                estado.innerText = "ERROR: ACTIVA LOS PERMISOS DE CÁMARA";
                estado.style.color = "red";
            }
        }

        // 2. Función para encender la cámara seleccionada
        async function iniciarStream(deviceId) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            
            const constraints = {
                video: { deviceId: { exact: deviceId } }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = currentStream;
                estado.innerText = "MOSTRANDO: " + selectCamaras.options[selectCamaras.selectedIndex].text;
            } catch (err) {
                console.error("No se pudo conectar a esa cámara", err);
            }
        }

        // 3. Evento cuando cambias la opción en el selector
        selectCamaras.addEventListener('change', () => {
            iniciarStream(selectCamaras.value);
        });

        // Iniciar todo al cargar la página
        window.onload = cargarCamaras;
    </script>
</body>
</html>
