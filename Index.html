<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Maestro Gafas</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        #visor-principal { 
            width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #111; 
            margin: 10px auto; border: 2px solid #00ff00; border-radius: 12px; overflow: hidden; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-mac {
            width: 100%; max-width: 600px; padding: 25px; margin: 10px auto;
            background: #00ff00; color: #000; border: none; border-radius: 15px;
            font-size: 20px; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 600px; margin: 15px auto; }
        button.accion { padding: 20px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; color: white; }
        #estado { color: #0f0; background: #222; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="estado">SISTEMA INICIALIZADO - ESPERANDO GAFAS</div>

    <button class="btn-mac" onclick="vincularGafas()">🔗 CONECTAR A DIRECCIÓN MAC / GAFAS</button>

    <div id="visor-principal">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controles">
        <button class="accion" style="background:#ffcc00; color:000;">📸 FOTO</button>
        <button class="accion" style="background:#ff4444;">🎥 GRABAR</button>
        <button class="accion" style="background:#007bff;">VOL +</button>
        <button class="accion" style="background:#007bff;">VOL -</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const estado = document.getElementById('estado');

        async function vincularGafas() {
            try {
                estado.innerText = "ESCANEANDO DISPOSITIVOS BLUETOOTH...";
                
                // Intentamos despertar el protocolo Bluetooth del navegador
                // Esto abrirá la lista donde aparecerá la MAC o el nombre de tus gafas
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service', 'device_information']
                });

                estado.innerText = "VINCULADO A: " + (device.name || device.id);

                // Una vez el Bluetooth da el "OK", forzamos al sistema a capturar el video
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });

                video.srcObject = stream;
                estado.innerText = "CONEXIÓN ESTABLECIDA - RECIBIENDO VIDEO";

            } catch (err) {
                console.error(err);
                estado.innerText = "ERROR: SE CANCELÓ LA VINCULACIÓN O NO HAY PERMISO";
                
                // Si el Bluetooth no activa el video, intentamos abrir la cámara de respaldo
                const fallback = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = fallback;
            }
        }
    </script>
</body>
</html>
