<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Gafas Wireless</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 10px; }
        #visor-contenedor { 
            width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #111; 
            margin: 10px auto; border: 2px solid #333; border-radius: 12px; overflow: hidden; 
        }
        /* Si las gafas envían video por IP, lo veremos aquí */
        #videoStream { width: 100%; height: 100%; object-fit: contain; }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 600px; margin: 15px auto; }
        button { padding: 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-link { background: #00ff00; color: #000; width: 100%; max-width: 600px; padding: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>MODO INALÁMBRICO</h2>
    
    <div id="visor-contenedor">
        <img id="videoStream" src="" alt="Esperando señal de video de las gafas...">
    </div>

    <input type="text" id="ipGafas" placeholder="Pega aquí la IP de las gafas (ej: 192.168.1.1)" 
           style="width: 80%; padding: 10px; margin-bottom: 10px; border-radius: 5px;">
    
    <button class="btn-link" onclick="conectarFlujo()">CONECTAR VIDEO INALÁMBRICO</button>

    <div class="controles">
        <button style="background: #ffcc00;">📸 FOTO</button>
        <button style="background: #ff4444; color: white;">🎥 GRABAR</button>
        <button style="background: #007bff; color: white;">VOL +</button>
        <button style="background: #007bff; color: white;">VOL -</button>
    </div>

    <script>
        function conectarFlujo() {
            const ip = document.getElementById('ipGafas').value;
            const visor = document.getElementById('videoStream');
            
            if(ip) {
                // Intentamos conectar al flujo de video típico de estas gafas
                // Puede ser /video, /stream, o solo la IP
                visor.src = "http://" + ip + ":8080/video"; 
                alert("Intentando conectar a: " + ip);
            } else {
                alert("Por favor, ingresa la dirección IP que te daban las gafas.");
            }
        }
    </script>
</body>
</html>
