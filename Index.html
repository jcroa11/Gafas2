<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gafas Pro - Enlace Maestro</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; }
        #visor-marco { 
            width: 100%; max-width: 600px; aspect-ratio: 16/9; background: #111; 
            margin: 10px auto; border: 2px solid #00ff00; border-radius: 12px; overflow: hidden; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-emparejar {
            width: 100%; max-width: 600px; padding: 25px; margin: 10px auto;
            background: #00ff00; color: #000; border: none; border-radius: 15px;
            font-size: 18px; font-weight: bold; cursor: pointer; display: block;
        }
        #estado { background: #222; padding: 10px; border-radius: 8px; color: #0f0; font-size: 13px; margin-bottom: 10px; }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 600px; margin: 15px auto; }
        button.accion { padding: 20px; border: none; border-radius: 10px; font-weight: bold; color: white; }
    </style>
</head>
<body>

    <div id="estado">SISTEMA LISTO: ESPERANDO VINCULACIÓN</div>

    <button class="btn-emparejar" id="btnBluetooth">🔗 EMPAREJAR GAFAS POR DIRECCIÓN MAC</button>

    <div id="visor-marco">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="controles">
        <button class="accion" style="background:#ffcc00; color:000;">📸 FOTO</button>
        <button class="accion" style="background:#ff4444;">🎥 GRABAR</button>
        <button class="accion" style="background:#007bff;">VOL +</button>
        <button class="accion" style="background:#007bff;">VOL -</button>
    </div>

    <script>
        const btn = document.getElementById('btnBluetooth');
        const estado = document.getElementById('estado');
        const video = document.getElementById('video');

        btn.addEventListener('click', async () => {
            try {
                estado.innerText = "ESCANEANDO... MANTÉN LAS GAFAS CERCA";
                
                // Forzamos al navegador a abrir la interfaz de selección de Bluetooth
                // Esto es lo que permite conectar con la MAC del dispositivo
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true
                });

                estado.innerText = "CONECTADO A: " + (device.name || "DISPOSITIVO MAC");

                // Una vez emparejado, intentamos activar el flujo de video
                // Si el hardware lo permite, el stream cambiará a las gafas
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" }
                });
                
                video.srcObject = stream;
                estado.innerText = "VIDEO SINCRONIZADO";

            } catch (err) {
                console.error(err);
                estado.innerText = "ERROR: NO SE PUDO EMPAREJAR. REINTENTA.";
                
                // Si falla el Bluetooth, intentamos abrir la cámara trasera como respaldo
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(s => video.srcObject = s);
            }
        });
    </script>
</body>
</html>
